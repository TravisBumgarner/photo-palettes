<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f8f9fa">
    <table
      width="100%"
      border="0"
      cellspacing="0"
      cellpadding="0"
      bgcolor="#f8f9fa"
    >
      <tr>
        <td align="center" style="padding: 40px 15px">
          <table
            width="500"
            border="0"
            cellspacing="0"
            cellpadding="0"
            bgcolor="#ffffff"
            style="border: 1px solid #e0e0e0"
          >
            <tr>
              <td align="center" style="padding: 32px 24px">
                <img
                  src="https://photopalettes.com/public/favicon.png"
                  width="48"
                  height="48"
                  alt="Photo Palettes Icon"
                  style="display: block; margin-bottom: 24px"
                />
                <h2
                  style="
                    font-family: Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 900;
                    color: #000000;
                    margin: 0 0 16px;
                  "
                >
                  Reset Password
                </h2>
                <p
                  style="
                    font-family: Arial, sans-serif;
                    font-size: 15px;
                    color: #333333;
                    line-height: 1.5;
                    margin: 0 0 28px;
                  "
                >
                  Follow this link to reset the password for your user:
                </p>
                <!-- Primary button -->
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    font-family: Arial, sans-serif;
                    font-size: 15px;
                    font-weight: 900;
                    text-transform: none;
                    text-decoration: none;
                    background-color: #000000;
                    color: #ffffff;
                    padding: 12px 24px;
                    display: inline-block;
                    border-radius: 0;
                    border: 1px solid #000000;
                    box-shadow: none;
                  "
                >
                  Reset Password
                </a>
                <p
                  style="
                    font-family: Arial, sans-serif;
                    font-size: 12px;
                    color: #666666;
                    line-height: 1.5;
                    margin: 32px 0 0;
                  "
                >
                  If you didn’t request a password reset, you can safely ignore
                  this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
