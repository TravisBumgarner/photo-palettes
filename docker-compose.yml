version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=https://lanpbkfvzvdpdapavwic.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbnBia2Z2enZkcGRhcGF2d2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1ODMxODMsImV4cCI6MjA2MDE1OTE4M30.JPCIXkvZL0O7x11PrscRNVjQFCyEV_kTcZpkKOplUy4
    volumes:
      - ./frontend:/app
      - /app/.next
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=photo_palettes
      - ENVIRONMENT=local

    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=photo_palettes
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
