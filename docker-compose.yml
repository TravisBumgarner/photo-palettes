version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=localhost
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=photo_palettes
      - POSTGRES_PORT=5432
      - ENVIRONMENT=development
      - SUPABASE_URL=https://lanpbkfvzvdpdapavwic.supabase.co
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbnBia2Z2enZkcGRhcGF2d2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1ODMxODMsImV4cCI6MjA2MDE1OTE4M30.JPCIXkvZL0O7x11PrscRNVjQFCyEV_kTcZpkKOplUy4
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - ENVIRONMENT=development
      - NEXT_PUBLIC_SHOW_NAVIGATION=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=https://lanpbkfvzvdpdapavwic.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbnBia2Z2enZkcGRhcGF2d2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1ODMxODMsImV4cCI6MjA2MDE1OTE4M30.JPCIXkvZL0O7x11PrscRNVjQFCyEV_kTcZpkKOplUy4
    command: npm run dev

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=photo_palettes

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
